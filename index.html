<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#eef1e4">
<link rel="icon" href="data:,">
<title>果冻三消 V3 · 阶段C</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#eef1e4;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
  #cA,#cG,#cGlow,#cBoard,#cOver{pointer-events:none}
  #cGlow,#cBoard,#cOver{transform-origin:0 0;will-change:transform,opacity}  /* v2.2: board + glow are separate compositor layers (shake / pulse without re-raster) */
  #cB{touch-action:none;outline:none}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;
    font:600 16px "PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:#6b6a55;
    background:#eef1e4;transition:opacity .3s}
  #boot.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="cA"></canvas>
<canvas id="cGlow"></canvas>
<canvas id="cBoard"></canvas>
<canvas id="cG"></canvas>
<canvas id="cOver"></canvas>  <!-- v3.1: gummy ties + delivery baskets above the jellies -->
<canvas id="cB" tabindex="0" aria-label="果冻三消：方向键移动焦点，回车选择，Esc 取消"></canvas>
<div id="boot">果冻加载中…</div>
<!-- plain script tags only (no modules / fetch) so it runs from file:// -->
<script src="js/config.js"></script>
<script src="js/sprites.js"></script>
<script src="js/core.js"></script>
<script src="js/softbody.js"></script>
<script src="js/material_octopus.js"></script>
<script src="js/volume.js"></script>
<script src="js/renderer.js"></script>
<script src="js/score_service.js"></script>
<script src="js/rules_core.js"></script>
<script src="js/progress_store.js"></script>
<script src="js/menu.js"></script>
<script src="js/level_schema.js"></script>
<script src="js/obstacle_art.js"></script>
<script src="levels/levels_data.js"></script>
<script src="js/game.js"></script>
</body>
</html>
